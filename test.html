const results = [];
const t = (name, fn) => { try { fn(); results.push("PASS " + name); } catch (e) { results.push("FAIL " + name + " :: " + e.message); } };
/* async tests run after every sync one, in declaration order — a plain t()
   would report a rejected promise as PASS. */
const asyncTests = [];
const ta = (name, fn) => asyncTests.push([name, fn]);
const assert = (c, m) => { if (!c) throw new Error(m || "assert"); };
/* v16: everyone shares the cockpit; the tablet shell is now a per-device mode */
/* v19: time is counted in working hours, so anything that measures a duration
   must run at a known moment inside the shift — otherwise the suite passes or
   fails depending on what time of day it is run. */
const WORK_NOW = new Date(2026, 8, 8, 14, 0, 0, 0).getTime();   // Tue 2026-09-08, 14:00
const atWork = (fn, at = WORK_NOW) => {
  const real = Date.now;
  Date.now = () => at;
  try { return fn(); } finally { Date.now = real; }
};
const bench = (on) => { on ? localStorage.setItem("shopflow.bench", "1") : localStorage.removeItem("shopflow.bench"); };

localStorage.clear();
Store.load();

t("article order auto-creates parallel part-group tasks (2× Cutting)", () => {
  const o = M.createOrder({ type: "prod", product: "Test kitchen", client: "T", due: Date.now() + 7 * DAY, lines: [{ articleId: "a-bc600", qty: 12 }] }, "m1");
  assert(o.items.length === 1 && o.items[0].qty === 12, "item line");
  assert(o.ops.length === 10, "10 tasks from 3 lanes, got " + o.ops.length);
  const cuts = o.ops.filter(op => op.stationId === "cut");
  assert(cuts.length === 2, "two cutting tasks");
  assert(new Set(cuts.map(c => c.group)).size === 2, "one per part group");
  assert(o.ops.find(op => op.stationId === "cut" && op.group === "Facades"), "facades cut");
  assert(o.ops.find(op => op.stationId === "cut" && op.group === "Carcass"), "carcass cut");
  window.__laneOrder = o.id;
});

t("piece flow: downstream unlocks as upstream reports qty", () => {
  const o = D.order(window.__laneOrder);
  const cutC = o.ops.find(op => op.stationId === "cut" && op.group === "Carcass");
  const edgeC = o.ops.find(op => op.stationId === "edge" && op.group === "Carcass");
  const cncC = o.ops.find(op => op.stationId === "cnc" && op.group === "Carcass");
  const asm = o.ops.find(op => op.stationId === "asm");
  assert(D.opReady(o, cutC), "first lane op ready");
  assert(!D.opReady(o, edgeC), "edge waits for cut output");
  assert(!D.opReady(o, asm), "final lane waits for part lanes");
  M.reportQty(o.id, cutC.id, 5, "m3");
  assert(cutC.qtyDone === 5 && cutC.status !== "done", "partial report");
  assert(D.opReady(o, edgeC) && D.opAvail(o, edgeC) === 5, "edge unlocked, capped at 5");
  assert(!D.opReady(o, cncC), "cnc still waits");
  assert(!D.opReady(o, asm), "asm still waits (facades lane empty)");
  M.reportQty(o.id, cutC.id, 12, "m3");
  assert(cutC.status === "done" && cutC.qtyDone === 12, "auto-complete at full qty");
});

t("completeOp with partial upstream reports available and stays open", () => {
  const o = D.order(window.__laneOrder);
  const edgeC = o.ops.find(op => op.stationId === "edge" && op.group === "Carcass");
  const cncC = o.ops.find(op => op.stationId === "cnc" && op.group === "Carcass");
  M.reportQty(o.id, edgeC.id, 7, "m4");
  const res = M.completeOp(o.id, cncC.id, "m4"); // only 7 available upstream
  assert(res === null, "no next op returned");
  assert(cncC.status === "paused" && cncC.qtyDone === 7, "partial completion recorded");
  M.completeOp(o.id, edgeC.id, "m4"); // finish edge fully (12 avail from cut)
  assert(edgeC.status === "done", "edge done");
  const res2 = M.completeOp(o.id, cncC.id, "m4");
  assert(cncC.status === "done" && cncC.qtyDone === 12, "cnc completes when upstream full");
});

/* ---------- review-driven regression tests ---------- */
t("regression: qty stepper decrements one step even when count exceeds avail", () => {
  const o = M.createOrder({ type: "prod", product: "RQ", client: "T", due: Date.now() + DAY, lines: [{ articleId: "a-bc600", qty: 10 }] }, "m1");
  const cutC = o.ops.find(op => op.stationId === "cut" && op.group === "Carcass");
  const edgeC = o.ops.find(op => op.stationId === "edge" && op.group === "Carcass");
  M.reportQty(o.id, cutC.id, 7, "m3");
  M.reportQty(o.id, edgeC.id, 6, "m4");
  M.reportQty(o.id, cutC.id, 3, "m3"); // upstream corrected downward → edge avail (3) < qtyDone (6)
  assert(D.opAvail(o, edgeC) === 3, "avail dropped");
  M.reportQty(o.id, edgeC.id, edgeC.qtyDone - 1, "m4"); // "−" tap
  assert(edgeC.qtyDone === 5, "single-step decrement, got " + edgeC.qtyDone);
  M.reportQty(o.id, edgeC.id, edgeC.qtyDone + 1, "m4"); // "+" tap must not exceed
  assert(edgeC.qtyDone === 5, "no increment past avail");
  const before = edgeC.qtyDone;
  M.completeOp(o.id, edgeC.id, "m4"); // partial-complete must not lower the count
  assert(edgeC.qtyDone === before && edgeC.status === "paused", "completeOp keeps reported count");
  M.deleteOrder(o.id, "m1");
});

  assert(cutC.status === "queued" && cutC.qtyDone === 0, "target op reset");
  assert(edgeC.status === "queued" && edgeC.qtyDone === 0, "downstream reset too");
  M.deleteOrder(o.id, "m1");
});

t("regression: addOp inserts into its lane; packedSummary stays on final lane", () => {
  const o = M.createOrder({ type: "prod", product: "AO", client: "T", due: Date.now() + DAY, lines: [{ articleId: "a-bc600", qty: 5 }] }, "m1");
  M.addOp(o.id, "sand", 10, "m1", o.items[0].id, "Carcass");
  const lane = D.laneOps(o, o.items[0].id, "Carcass");
  assert(lane[lane.length - 1].stationId === "sand", "appended to Carcass lane");
  const fin = D.itemFinished(o, o.items[0].id);
  assert(fin.label === "packing", "final-lane op still defines 'finished', got " + fin.label);
  // lane-relative reorder works on the appended op even though array positions differ
  const added = lane[lane.length - 1];
  assert(M.moveOp(o.id, added.id, -1, "m1"), "move within lane");
  assert(D.laneOps(o, o.items[0].id, "Carcass")[lane.length - 2].id === added.id, "lane order updated");
  M.deleteOrder(o.id, "m1");
});

t("regression: startOp folds elapsed time of an unassigned running op", () => atWork(() => {
  const o = M.createOrder({ type: "prod", product: "TT", client: "T", due: Date.now() + DAY,
    route: [{ stationId: "cut", estMins: 30 }] }, "m1");
  const op = o.ops[0];
  M.startOp(o.id, op.id, "m3");
  op.startedAt = Date.now() - 60000; // simulate 1 min of work, inside the shift
  M.assignOp(o.id, op.id, null, "m1"); // manager unassigns while running
  M.startOp(o.id, op.id, "m4"); // another worker claims it
  assert(op.loggedMs >= 60000, "elapsed folded into loggedMs, got " + op.loggedMs);
  M.deleteOrder(o.id, "m1");
}));

t("whiteboard: board + element CRUD with author attribution", () => {
  const b = M.addBoard("Test board", "m2");
  assert(D.board(b.id) && b.createdBy === "m2");
  assert(Store.state.activity[0].text.includes("Test board"), "creation logged");
  const st1 = M.wbAdd(b.id, { type: "sticky", x: 10, y: 10, w: 180, h: 180, color: 0, text: "idea" }, "m3");
  const st2 = M.wbAdd(b.id, { type: "shape", x: 300, y: 10, w: 180, h: 64, color: 4, kind: "rect", text: "step" }, "m5");
  assert(st1.by === "m3" && st1.ts > 0, "author + timestamp");
  M.wbUpdate(b.id, st1.id, { x: 50, text: "better idea" });
  assert(D.board(b.id).els[0].x === 50 && D.board(b.id).els[0].text === "better idea");
  const c = M.wbConnect(b.id, st1.id, st2.id);
  assert(c && D.board(b.id).conns.length === 1, "connector");
  assert(M.wbConnect(b.id, st1.id, st2.id) === null, "no duplicate connectors");
  assert(M.wbConnect(b.id, st1.id, st1.id) === null, "no self connector");
  M.wbDelete(b.id, st2.id);
  assert(D.board(b.id).els.length === 1 && D.board(b.id).conns.length === 0, "connector cascades on delete");
  M.renameBoard(b.id, "Renamed", "m2");
  assert(D.board(b.id).name === "Renamed");
  M.deleteBoard(b.id, "m2");
  assert(!D.board(b.id), "board deleted");
});

/* ---------- v7: QR / barcode scanning ---------- */
t("scanParse: native token, project-code strip, prefix routing, unknown", () => {
  const o = M.createOrder({ type: "prod", product: "Scan job A", client: "T", due: Date.now() + DAY,
    route: [{ stationId: "cut", estMins: 30 }, { stationId: "edge", estMins: 20 }, { stationId: "pack", estMins: 10 }] }, "m1");
  window.__scanO = o.id;
  // SWOOD-style part code {PROJECT}_{n} → strip part number, match order.num
  const p1 = D.scanParse(o.num + "_404");
  assert(p1 && p1.order && p1.order.id === o.id, "matched by project code: " + JSON.stringify(p1 && p1.order && p1.order.num));
  assert(p1.partCode === o.num + "_404" && p1.project === o.num, "part + project split");
  // exact project code (no suffix)
  assert(D.scanParse(o.num).order.id === o.id, "exact code");
  // native token
  const nat = D.scanParse("SF|" + o.id + "|" + o.items[0].id + "|7");
  assert(nat.order.id === o.id && nat.partCode === "7", "native token");
  // prefix routing
  M.setScanPrefix("EDGE", "edge");
  const px = D.scanParse("EDGE#" + o.num + "_9");
  assert(px.stationId === "edge" && px.order.id === o.id, "prefix routes station");
  M.setScanPrefix("EDGE", null);
  // unknown
  assert(D.scanParse("ZZZ_NOPE_1").order === null, "unknown → no order");
});

t("seed PINs hashed with per-install salt; no plaintext anywhere", () => {

  assert(Store.state.v === 18 && Store.state.pinSalt, "migrated with salt");
  assert(Store.state.members.every(m => m.pinHash && m.pin === undefined), "legacy pins hashed + removed");
  assert(M.verifyPin(Store.state.members[0].id, "4321"), "hashed legacy pin verifies");

});

t("routing: add / move / remove ops with done-guard", () => {
  const o = M.createOrder({
    product: "Routing test", client: "T", qty: 1, unit: "u", priority: "normal",
    due: Date.now() + DAY, notes: "",
    route: [{ stationId: "cut", estMins: 30 }, { stationId: "asm", estMins: 60 }, { stationId: "pack", estMins: 15 }],

  M.addOp(o.id, "qc", 20, "m1");

  assert(M.removeOp(o.id, opId, "m1"), "remove");

  // cannot remove/move a done op

});

t("copy order: own number, same route, zero progress, no shared refs", () => {
  const src = D.order("o1");
  const n = Store.state.orders.length;
  const cp = M.duplicateOrder("o1", {}, "m1");
  assert(Store.state.orders.length === n + 1, "one new order");
  assert(cp.num !== src.num && cp.id !== src.id, "own identity");
  assert(cp.ops.length === src.ops.length, "same route length");
  assert(cp.ops.every(op => op.status === "queued" && !op.qtyDone && !op.loggedMs && !op.startedAt && !op.completedAt), "progress reset");
  assert(cp.ops.every(op => !src.ops.some(o => o.id === op.id)), "fresh op ids");
  assert(cp.items.every(it => !src.items.some(o => o.id === it.id)), "fresh item ids");
  assert(cp.ops.every(op => cp.items.some(it => it.id === op.itemId)), "ops rebound to the copy's items");
  assert(cp.comments.length === 0 && !cp.archived && !cp.shipped, "starts clean");

/* ============================================================
   v17 — SWOOD report-list import
   ============================================================ */

/* A miniature PARTLIST shaped exactly like the real export, including the
   traps: a "BAR CODE" column that does NOT belong to its own row, thickness
   banner rows between blocks, and a part with no board material. */
const SW_ROWS = (() => {
  const r = [];
  r[0] = []; r[0][6] = "PROJEKTAS"; r[0][8] = "TEST_PRJ";
  r[8] = ["BAR CODE", "PAVEIKSLIUKAS", "SOLIDNAME", "DETALĖS KODAS", "DETALĖ", "PLOKŠTĖ",
          "L", "W", "KIEKIS", "F", "B", "L", "R", "DXF", "NOTES"];
  r[9] = []; r[9][0] = "TEST_PRJ_11"; r[9][1] = "18 mm";                        // banner row
  const part = (i, code, name, board, l, w, q, edges, solid) => {
    const row = [];
    row[0] = "TEST_PRJ_999";                       // decoy barcode, never the row's own code
    row[2] = solid; row[3] = code; row[4] = name; row[5] = board;
    row[6] = l; row[7] = w; row[8] = q;
    edges.forEach((e, k) => { if (e) row[9 + k] = e; });
    r[i] = row;
  };
  part(10, "TEST_PRJ_11", "SIDE", "", 500, 300, 1, ["Edge1", "", "", ""], "SIDE_CAB_A");
  part(11, "TEST_PRJ_12", "SHELF", "BOARD 18", 600, 400, 2, ["Edge1", "Edge1", "", ""], "SHELF_CAB_A");
  part(12, "TEST_PRJ_13", "BACK", "HDF 3", 600, 400, 1, ["", "", "", ""], "BACK_CAB_B");
  part(13, "TEST_PRJ_14", "DOOR", "BOARD 18", 700, 400, 3, ["Edge2", "", "", ""], "DOOR_CAB_B");
  for (let i = 0; i < r.length; i++) if (!r[i]) r[i] = [];   // the reader never yields holes
  return r;
})();
const SW_STOCK = [[], [], ["", "Picture", "Part", "Num Pan", "Feature", "Material", "", "", "", "", "", "Qty", "ml", "m²"],
  ["", "", "SIDE_CAB_A", "", "CORE", "BOARD 18", "", "", "", "", "", 1, 0.5, 0.15],
  ["", "", "SHELF_CAB_A", "", "CORE", "BOARD 18", "", "", "", "", "", 2, 1.2, 0.48]];
const SW_EDGE = [[], [], ["", "Picture", "Part", "Num Pan", "Feature", "Material", "", "", "Length", "Thickness", "Qty", "m"],
  ["", "", "SIDE_CAB_A", "", "Edgeband1", "Edge1", "", "", 500, 0.6, 1, 0.5],
  ["", "", "SHELF_CAB_A", "", "Edgeband1", "Edge1", "", "", 600, 0.6, 2, 1.2]];
const SW_HW = [[], [], [], [], [], [], ["", "Picture", "Name", "Supplier", "Supplier Ref", "Qty"],
  ["", "", "Screw 4x30", "Blum", "X1", 40], ["", "", "Hinge", "Blum", "X2", 8]];

/* stand in for the workbook reader so the tests need no binary fixture */
const swStub = () => {
  const orig = XLSX.open;
  XLSX.open = async () => ({ rows: async (n) => ({ PARTLIST: SW_ROWS, STOCK_CORE: SW_STOCK,
    EDGEBAND: SW_EDGE, HARDWARE_LIST: SW_HW }[n] || null) });
  return () => { XLSX.open = orig; };
};

ta("SWOOD parse: reads parts, project and consumables", async () => {
  const restore = swStub();
  const p = await SWOOD.parse(new ArrayBuffer(8));
  restore();
  assert(p.project === "TEST_PRJ", "project code: " + p.project);
  assert(p.parts.length === 4, "4 parts, banner row skipped :: " + p.parts.length);
  assert(p.totalPieces === 7, "pieces sum KIEKIS :: " + p.totalPieces);
  const shelf = p.parts.find(x => x.code === "TEST_PRJ_12");
  assert(shelf && shelf.name === "SHELF" && shelf.l === 600 && shelf.w === 400 && shelf.qty === 2, "part fields");
  assert(shelf.edges.filter(Boolean).length === 2 && shelf.edged, "edges read");
  assert(p.parts.find(x => x.code === "TEST_PRJ_13").edged === false, "un-edged part detected");
});

  // every row carried "TEST_PRJ_999" in the BAR CODE column; no part may take it
  assert(!p.parts.some(x => x.code === "TEST_PRJ_999"), "decoy barcode ignored");
  assert(p.parts.map(x => x.code).join() === "TEST_PRJ_11,TEST_PRJ_12,TEST_PRJ_13,TEST_PRJ_14", "codes from DETALĖS KODAS");
});

/* The bug this guards: a template with one extra column shifted every fixed
   offset, so KIEKIS was read from the column where W had landed — and a panel
   306 mm wide was imported as 306 pieces. */
const SW_SHIFTED = (() => {
  const r = [];
  r[0] = []; r[0][6] = "PROJEKTAS"; r[0][8] = "SHIFT_PRJ";
  //                                            an extra column, before L
  r[4] = ["BAR CODE", "PAVEIKSLIUKAS", "SOLIDNAME", "DETALĖS KODAS", "DETALĖ", "PLOKŠTĖ",
          "STORIS", "L", "W", "KIEKIS", "F", "B", "L", "R", "NOTES"];
  const part = (i, code, name, board, th, l, w, q, solid) => {
    const row = [];
    row[0] = "X"; row[2] = solid; row[3] = code; row[4] = name; row[5] = board;
    row[6] = th; row[7] = l; row[8] = w; row[9] = q;
    r[i] = row;
  };
  part(5, "SHIFT_1", "SONAS", "U961 ST7", 18, 720, 306, 1, "SONAS_A");
  part(6, "SHIFT_2", "LENTYNA", "U961 ST7", 18, 600, 306, 1, "LENTYNA_A");
  for (let i = 0; i < r.length; i++) if (!r[i]) r[i] = [];
  return r;
})();

ta("SWOOD parse: an extra column cannot turn a panel's width into its quantity", async () => {

  const p = await SWOOD.parse(new ArrayBuffer(8));

  assert(p.parts.length === 2, "both rows read :: " + p.parts.length);

  assert(p.parts[0].board === "U961 ST7", "the board survives the shift too");

  const plan = SWOOD.plan(p);

});

});

/* The shop's own station list: names in Lithuanian, ids generated by the
   backup converter ("st-pjovimas"), nothing called "cut" or "edge". Asking for
   the seed's ids used to miss every one, so an imported job got a single
   cutting step and looked finished the moment it was cut. */
const LT_STATIONS = [
  { id: "st-pjovimas",      name: "Pjovimas",        estMins: 90,  kind: "prod" },
  { id: "st-briaunavimas",  name: "Briaunavimas",    estMins: 60,  kind: "prod" },
  { id: "st-grezimas",      name: "Gręžimas",        estMins: 45,  kind: "prod" },
  { id: "st-surinkimas",    name: "Surinkimas",      estMins: 120, kind: "prod" },
  { id: "st-apdaila",       name: "Apdaila",         estMins: 120, kind: "prod" },
  { id: "st-pakavimas",     name: "Pakavimas",       estMins: 30,  kind: "prod" },
  { id: "st-isstatymas",    name: "Išstatymas / KK", estMins: 45,  kind: "prod" },
];
const withLTStations = (fn) => {
  const orig = Store.state.stations;
  Store.state.stations = [...LT_STATIONS, ...orig.filter(s => s.kind === "eng")];
  try { return fn(); } finally { Store.state.stations = orig; }
};

t("a production stage is found by name, not by the seed's id", () => withLTStations(() => {
  assert(D.stationFor("cut").id === "st-pjovimas", "Pjovimas is cutting");
  assert(D.stationFor("edge").id === "st-briaunavimas", "Briaunavimas is edge banding");
  assert(D.stationFor("cnc").id === "st-grezimas", "Gręžimas is drilling — diacritics and all");
  assert(D.stationFor("asm").id === "st-surinkimas", "Surinkimas is assembly");
  assert(D.stationFor("pack").id === "st-pakavimas", "Pakavimas is packing");
  assert(D.stationFor("qc").id === "st-isstatymas", "“Išstatymas / KK” is the quality step :: "
    + (D.stationFor("qc") || {}).id);
}));

t("the seed's own ids still resolve, and an absent stage returns nothing", () => {
  assert(D.stationFor("cut").id === "cut", "the demo install matches by id");
  assert(D.stationFor("edge").id === "edge", "as before");
  const orig = Store.state.stations;
  Store.state.stations = [{ id: "only", name: "Pjovimas", estMins: 30, kind: "prod" }];
  assert(D.stationFor("cut").id === "only", "cutting is found");
  assert(D.stationFor("edge") === null, "and a stage the shop does not have is null, not a guess");
  Store.state.stations = orig;
});

ta("SWOOD plan: routes a job through the shop's OWN stations", async () => {
  const restore = swStub();
  const parsed = await SWOOD.parse(new ArrayBuffer(8));
  restore();
  const plan = withLTStations(() => SWOOD.plan(parsed));

  const edged = plan.items.find(i => i.name === "BOARD 18");
  assert(edged.route.length === 3, "cut → edge → drill, not one lonely step :: " + edged.route.length);
  assert(edged.route.join() === "st-pjovimas,st-briaunavimas,st-grezimas", "in that order :: " + edged.route.join());
  const bare = plan.items.find(i => i.name === "HDF 3");
  assert(!bare.route.includes("st-briaunavimas"), "a material with no edged parts skips edge banding");
  assert(plan.finalRoute.join() === "st-surinkimas,st-isstatymas,st-pakavimas",
    "and the job still ends in assembly, checking and packing :: " + plan.finalRoute.join());
  assert(!plan.missingStages.length, "nothing was missing :: " + plan.missingStages);
});

ta("a job imported with a stunted route can be filled in without losing work", async () => {
  const restore = swStub();
  const parsed = await SWOOD.parse(new ArrayBuffer(8));
  restore();

  /* import it the way it used to happen: only cutting exists */
  const orig = Store.state.stations;
  Store.state.stations = [{ id: "st-pjovimas", name: "Pjovimas", estMins: 90, kind: "prod" }];
  const stunted = SWOOD.plan(parsed);
  const o = M.createFromSwood(stunted, { product: "Stunted route" }, "m1");
  Store.state.stations = orig;

  assert(o.ops.every(op => op.stationId === "st-pjovimas"), "every task is cutting");
  const boardItem = o.items.find(i => i.name === "BOARD 18");
  const cutOp = o.ops.find(op => op.itemId === boardItem.id);

  /* the shop cut most of it before anyone noticed */
  cutOp.status = "done"; cutOp.qtyDone = boardItem.qty; cutOp.completedAt = Date.now(); cutOp.loggedMs = 3600000;

  withLTStations(() => {
    const gaps = D.swoodRouteGaps(o);
    assert(gaps, "the gap is detected");
    const n = M.repairSwoodRoute(o.id, "m1");
    assert(n >= 4, "several steps added :: " + n);
  });

  const after = o.ops.find(op => op.id === cutOp.id);
  assert(after.status === "done" && after.qtyDone === boardItem.qty && after.loggedMs === 3600000,
    "the cutting already done is untouched");
  const boardOps = o.ops.filter(op => op.itemId === boardItem.id);
  assert(boardOps.some(op => op.stationId === "st-briaunavimas"), "edge banding now exists for it");
  assert(boardOps.some(op => op.stationId === "st-grezimas"), "so does drilling");
  assert(boardOps[0].id === cutOp.id, "and cutting is still first :: " + boardOps.map(x => x.stationId));
  assert(boardOps.every(op => op.id === cutOp.id || op.status === "queued"), "the new steps start queued");
  assert(o.items.some(i => i.name === "Surinkimas ir pakavimas"), "the closing line was added too");

  /* the plain material — no edged parts — must not gain edge banding */
  const bare = o.items.find(i => i.name === "HDF 3");

ta("SWOOD preview: the scope multiplies once, and re-reading never compounds", async () => {
  const restore = swStub();
  const parsed = await SWOOD.parse(new ArrayBuffer(8));
  restore();
  SwoodImport.plan = SWOOD.plan(parsed);
  SwoodImport.scope = 1; SwoodImport.lineEdits = {}; SwoodImport.consEdits = {};
  const base = SwoodImport.lineRows().map(l => l.qty);
  const baseCons = SwoodImport.consRows().map(c => c.qty);
  assert(base.length && base.every(q => q > 0), "there is something to scale :: " + base);

  SwoodImport.scope = 16;
  const scaled = SwoodImport.lineRows().map(l => l.qty);
  assert(scaled.join() === base.map(q => q * 16).join(),
    "lines are exactly ×16 :: " + base.join() + " → " + scaled.join());
  const consScaled = SwoodImport.consRows().map(c => c.qty);
  assert(consScaled.join() === baseCons.map(q => Math.round(q * 16 * 1000) / 1000).join(),
    "so are the materials :: " + baseCons.join() + " → " + consScaled.join());

  /* the screen re-renders on every keystroke elsewhere in the dialog; reading
     the rows again must not multiply what was already multiplied */
  assert(SwoodImport.lineRows().map(l => l.qty).join() === scaled.join(), "reading twice is stable");
  assert(SwoodImport.lineRows().map(l => l.qty).join() === scaled.join(), "and a third time");

  /* and what gets created matches exactly what the preview promised */
  const o = M.createFromSwood(SwoodImport.plan, { product: "Preview vs created", scope: 16 }, "m1");
  const made = SwoodImport.plan.items.map(it =>
    o.items.find(i => i.name === it.name).qty);
  assert(made.join() === scaled.join(), "the order matches the preview :: " + made.join() + " vs " + scaled.join());
  M.deleteOrder(o.id, "m1");
  SwoodImport.scope = 1; SwoodImport.plan = null;
});

/* ============================================================
   v19 — working hours + automatic (scan-driven) time tracking
   ============================================================ */
const T = (y, mo, d, h, mi) => new Date(y, mo - 1, d, h, mi || 0, 0, 0).getTime();
const mins = (ms) => Math.round(ms / 60000);

t("shift: a working day is the hours minus the breaks", () => {
  const sh = D.shift();
  assert(sh.start === "08:00" && sh.end === "17:00", "08:00–17:00");
  assert(sh.breaks.length === 3, "three breaks");
  assert(mins(D.shiftDayMs()) === 465, "9h less 15+45+15 = 7h45 :: " + mins(D.shiftDayMs()));
  const spans = D._shiftSpans();
  assert(spans.length === 4, "four worked spans a day");
});

t("shift: evenings, nights and weekends contribute nothing", () => {
  assert(mins(D.workMsBetween(T(2026, 9, 8, 17, 0), T(2026, 9, 9, 8, 0))) === 0, "overnight = 0");
  assert(mins(D.workMsBetween(T(2026, 9, 12, 8, 0), T(2026, 9, 13, 17, 0))) === 0, "a whole weekend = 0");
  assert(mins(D.workMsBetween(T(2026, 9, 8, 16, 0), T(2026, 9, 9, 9, 0))) === 120, "16:00→09:00 = 2h");
  assert(mins(D.workMsBetween(T(2026, 9, 11, 16, 0), T(2026, 9, 14, 9, 0))) === 120, "Fri 16:00 → Mon 09:00 = 2h");
  assert(D.workMsBetween(T(2026, 9, 8, 12, 0), T(2026, 9, 8, 9, 0)) === 0, "a reversed range is 0, not negative");
});

t("shift: breaks are cut out of the middle of a run", () => {
  assert(mins(D.workMsBetween(T(2026, 9, 8, 9, 0), T(2026, 9, 8, 11, 0))) === 105, "09:00–11:00 less the 10:00 break");
  assert(mins(D.workMsBetween(T(2026, 9, 8, 11, 30), T(2026, 9, 8, 13, 0))) === 45, "11:30–13:00 less lunch");
  assert(D.workMsBetween(T(2026, 9, 8, 12, 0), T(2026, 9, 8, 12, 45)) === 0, "lunch itself is 0");
  assert(mins(D.workMsBetween(T(2026, 9, 7, 8, 0), T(2026, 9, 11, 17, 0))) === 5 * 465, "Mon–Fri = 5 full days");
});

t("shift: a run across the DST change counts working days, not 24h blocks", () => {
  // Europe/Vilnius clocks go back on Sun 2026-10-25
  assert(mins(D.workMsBetween(T(2026, 10, 23, 8, 0), T(2026, 10, 26, 17, 0))) === 2 * 465,
    "Fri + Mon only :: " + mins(D.workMsBetween(T(2026, 10, 23, 8, 0), T(2026, 10, 26, 17, 0))));
});

t("shift: isWorkingNow knows the shift, the breaks and the weekend", () => {
  assert(D.isWorkingNow(T(2026, 9, 8, 9, 30)), "09:30 Tuesday");
  assert(!D.isWorkingNow(T(2026, 9, 8, 12, 30)), "not during lunch");
  assert(!D.isWorkingNow(T(2026, 9, 8, 19, 0)), "not in the evening");
  assert(!D.isWorkingNow(T(2026, 9, 12, 10, 0)), "not on Saturday");
});

t("a task left running overnight bills the working hours only", () => {
  const op = { status: "running", loggedMs: 0, startedAt: T(2026, 9, 8, 16, 30) };
  atWork(() => assert(mins(D.opElapsed(op)) === 60, "16:30 → 08:30 next day = 1h :: " + mins(D.opElapsed(op))),
         T(2026, 9, 9, 8, 30));
  atWork(() => assert(mins(D.opElapsed(op)) === 30 + 3 * 465 + 30, "over a weekend, only the working days count"),
         T(2026, 9, 14, 8, 30));
});

t("scanning starts and extends the clock — no play/pause", () => atWork(() => {
  const o = M.createOrder({ type: "prod", product: "Auto clock", client: "T", due: Date.now() + DAY,
    route: [{ stationId: "cut", estMins: 30 }] }, "m1");
  const op = o.ops[0];
  assert(op.status === "queued" && !op.startedAt, "starts idle");
  M.touchScanClock(op, "m3");
  assert(op.status === "running" && op.autoStarted && op.startedAt === Date.now(), "first scan opens a run");
  const opened = op.startedAt;
  op.startedAt = Date.now() - 20 * 60000; op.lastScanAt = Date.now() - 20 * 60000;
  M.touchScanClock(op, "m3");
  assert(op.startedAt === Date.now() - 20 * 60000, "a later scan extends the run, it does not restart it");
  assert(mins(D.opElapsed(op)) === 20, "elapsed follows the scans :: " + mins(D.opElapsed(op)));
  window.__clockO = o.id;
}));

t("the clock stops itself after the scanning goes quiet", () => atWork(() => {
  const o = D.order(window.__clockO), op = o.ops[0];
  op.startedAt = Date.now() - 60 * 60000;       // 13:00
  op.lastScanAt = Date.now() - 40 * 60000;      // 13:20, then silence
  assert(D.opRunStale(op), "silence past the grace makes it stale");
  assert(mins(D.opElapsed(op)) === 50, "counted to the last scan + 30m grace :: " + mins(D.opElapsed(op)));
  const settled = D.opElapsed(op);
  atWork(() => assert(D.opElapsed(op) === settled, "and it never creeps up afterwards"), Date.now() + 3 * 3600000);
  assert(M.sweepClocks() >= 1, "the sweep settles it");
  assert(op.status !== "running" && !op.startedAt && !op.autoStarted, "no longer shown as live work");
  assert(mins(op.loggedMs) === 50, "logged exactly what was counted :: " + mins(op.loggedMs));
}));

t("an idle grace that spans a break is not paid for the break", () => atWork(() => {
  const op = { status: "running", autoStarted: true, loggedMs: 0,
               startedAt: T(2026, 9, 8, 11, 40), lastScanAt: T(2026, 9, 8, 12, 0) };

t("a long name and a long role badge never draw over each other", () => {
  App.me = Store.state.members.find(m => m.role === "manager" || m.role === "owner");
  const probe = M.addMember({ name: "Mantas Projektavimas Pavardenis", trade: "Projektavimas ir brėžiniai",
    role: "engineer", pin: "9911" }, App.me.id);
  App.view = "team"; App.render();

  const hits = [];
  for (const card of $$(".member-card")) {
    const name = card.querySelector(".meta b"), badge = card.querySelector(".role-badge");
    if (!name || !badge) continue;
    const a = name.getBoundingClientRect(), b = badge.getBoundingClientRect();
    /* two boxes overlap unless one is wholly left, right, above or below */
    if (!(a.right <= b.left + 0.5 || b.right <= a.left + 0.5 ||
          a.bottom <= b.top + 0.5 || b.bottom <= a.top + 0.5)) hits.push("overlap: " + name.textContent.trim());
    if (name.scrollWidth > name.clientWidth + 1) hits.push("clipped: " + name.textContent.trim());
    if (badge.scrollWidth > badge.clientWidth + 1) hits.push("badge clipped: " + badge.textContent.trim());
  }
  assert(!hits.length, hits.join(" / "));
  assert($$(".member-card").length === Store.state.members.length, "every member drew a card");

  M.removeMember(probe.id, App.me.id);
});

t("a station can name who its work goes to", () => {
  const eng = D.stationsOf("eng");
  const idea = eng[0], rest = eng[1];
  const mantas = Store.state.members.find(m => m.role === "engineer") || Store.state.members[1];

  M.setStationDefault(rest.id, [mantas.id], "m1");
  assert(D.stationDefault(rest.id) === mantas.id, "the station remembers :: " + D.stationDefault(rest.id));
  assert(D.stationDefault(idea.id) === null, "and the one you left alone stays open to anyone");

  const o = M.createOrder({ type: "eng", product: "Default probe", client: "T",
    due: Date.now() + DAY, stages: [idea.id, rest.id] }, "m1");
  const first = o.ops.find(x => x.stationId === idea.id);
  const second = o.ops.find(x => x.stationId === rest.id);
  assert(!first.assigneeId, "a new project's idea is nobody's yet :: " + first.assigneeId);
  assert(second.assigneeId === mantas.id, "the rest is already his :: " + second.assigneeId);
  assert(D.opAssigneeIds(second).includes(mantas.id), "and the crew list agrees");

  /* a step added by hand later gets it too */
  M.addOp(o.id, rest.id, 60, "m1");
  const added = o.ops.filter(x => x.stationId === rest.id).pop();
  assert(added.assigneeId === mantas.id, "so does a step added afterwards :: " + added.assigneeId);

  /* the setting alone would leave everything already on the board blank */
  const old = M.createOrder({ type: "eng", product: "Already there", client: "T",
    due: Date.now() + DAY, stages: [idea.id] }, "m1");
  M.assignOp(old.id, old.ops[0].id, null, "m1");
  const before = M.pendingAtStation(idea.id);
  assert(before > 0, "there is something waiting :: " + before);
  const n = M.assignPendingAtStation(idea.id, mantas.id, "m1");
  assert(n === before, "and it can all be taken in one go :: " + n + " of " + before);
  assert(M.pendingAtStation(idea.id) === 0, "nothing unassigned left there");
  assert(old.ops[0].assigneeId === mantas.id, "including the one that was already open");

  /* clearing it stops future work being handed over */
  M.setStationDefault(rest.id, [], "m1");
  assert(D.stationDefault(rest.id) === null, "it can be cleared");
  const o2 = M.createOrder({ type: "eng", product: "After clearing", client: "T",
    due: Date.now() + DAY, stages: [rest.id] }, "m1");
  assert(!o2.ops[0].assigneeId, "and new work is nobody's again :: " + o2.ops[0].assigneeId);

  M.setStationDefault(idea.id, [], "m1");
  M.deleteOrder(o.id, "m1"); M.deleteOrder(old.id, "m1"); M.deleteOrder(o2.id, "m1");
});

ta("the vault holds a document far past what localStorage would take", async () => {
  const KEY = "probe-doc";
  await Vault.set(KEY, "q".repeat(3_000_000));          // 6 MB of UTF-16 — localStorage would throw
  const back = await Vault.get(KEY);
  assert(back && back.length === 3_000_000, "it came back whole :: " + (back && back.length));
  await Vault.del(KEY);
  assert(!(await Vault.get(KEY)), "and deletes");

  /* and the vault is budgeted against free disk, not the origin's 5 MB —
     the number the shop was hitting */
  const est = await Vault.size();
  assert(!est.quota || est.quota > QUOTA_GUESS * 2,
    "with far more room than localStorage has :: " + est.quota + " vs " + QUOTA_GUESS);
});

ta("a shop already running in localStorage is moved over, and only then let go", async () => {
  const realState = Store.state, realVault = Store._vault, realBk = Store._bk;

  localStorage.setItem("shopflow.v1", JSON.stringify(doc));
  localStorage.setItem("shopflow.backups", JSON.stringify(
    [{ ts: 111, reason: "an old restore point", keep: true, data: JSON.stringify(doc) }]));
  try {
    await Store.boot();
    assert(Store._vault, "the vault is in use");
    assert(Store.state.shopName === "Migration probe", "the shop's own data came across :: " + Store.state.shopName);
    assert(await Vault.get("doc"), "and it is in the vault");

    assert(localStorage.getItem("shopflow.backups") === null, "backups moved too");
    assert(Store._backups().some(b => b.ts === 111 && b.keep), "the named restore point survived the move :: "
      + JSON.stringify(Store._backups().map(b => b.ts)));
    assert(await Store.backupData(111), "and its snapshot is readable from the vault");

    /* what the hub reads instead of the whole document */
    const idx = JSON.parse(localStorage.getItem("shopflow.index"));

ta("autosave still happens on every change — it just lands somewhere with room", async () => {
  const realState = Store.state, realVault = Store._vault;
  await Vault.del("doc");
  Store._vault = true; Store._dirty = false;
  try {
    Store.state = { ...realState, shopName: "Autosave probe" };
    Store.save();                                       // synchronous to its caller, as it always was
    assert(Store._dirty, "the change is marked the instant save() returns");
    await Store.flush();
    const raw = await Vault.get("doc");
    assert(raw && JSON.parse(raw).shopName === "Autosave probe", "and it is on disk :: " + String(raw).slice(0, 60));
    assert(!Store._dirty, "nothing left outstanding");

    /* a burst of edits is one write, not forty */
    let writes = 0;
    const realSet = Vault.set;
    Vault.set = (k, v) => { writes++; return realSet.call(Vault, k, v); };
    try {
      for (let i = 0; i < 40; i++) { Store.state.shopName = "burst" + i; Store.save(); }
      await new Promise(r => setTimeout(r, Store.FLUSH_MS + 120));
      assert(writes === 1, "one transaction for the burst :: " + writes);
      assert(JSON.parse(await Vault.get("doc")).shopName === "burst39", "and the last edit is the one that stuck");
    } finally { Vault.set = realSet; }
  } finally {
    await Vault.del("doc");
    Store.state = realState; Store._vault = realVault; Store._dirty = false;
  }
});

/* Real canvas and IndexedDB work never settles under the headless runner's
   virtual clock, so the bytes are stubbed the way the SWOOD tests stub the
   workbook reader. What is under test is the orchestration: what gets shrunk,
   what is written where, and — the point of the whole design — that state
   grows by a thumbnail and not by a drawing. */
const fileStub = () => {
  const store = new Map();
  /* NOT Files.upload — the upload path is what the storage tests exercise */
  const orig = { draw: Files._draw, put: Files.putBlob, get: Files.getBlob, del: Files.delBlob };
  Files._draw = async (file, maxPx) => ({
    blob: { size: Math.round(file.size / 6), type: "image/jpeg" },
    w: maxPx, h: Math.round(maxPx * 0.7),
    dataUrl: "data:image/jpeg;base64," + "A".repeat(maxPx * 8),
  });
  Files.putBlob = async (id, blob) => { store.set(id, blob); };
  Files.getBlob = async (id) => store.get(id);
  Files.delBlob = async (id) => { store.delete(id); };
  return { store, restore: () => Object.assign(Files, { _draw: orig.draw, putBlob: orig.put, getBlob: orig.get, delBlob: orig.del }) };
};

ta("attaching an image shrinks it, keeps the bytes out of state, and can be undone", async () => {

    due: Date.now() + DAY, route: [{ stationId: "cut", estMins: 30 }] }, "m1");
  const file = { name: "brezinys.png", type: "image/png", size: 3_000_000 };

  assert(st.store.get(meta.id), "the bytes went to the blob store, not to state");
  assert(Files.here(meta), "recorded as held on this device");
  assert(D.filesFor({ opId: o.ops[0].id })[0].id === meta.id, "and it hangs off the task");

/* A stand-in for the Supabase Storage client, so the upload path is exercised
   without a network: `fail` makes every call error the way an offline tablet
   or a missing bucket does. */
const storageStub = ({ fail = false } = {}) => {
  const up = [], removed = [];
  const orig = Files.storage;
  Files.storage = () => ({
    upload: async (path, blob) => fail
      ? { error: { message: "Bucket not found" } }
      : (up.push({ path, size: blob.size }), { error: null }),
    remove: async (paths) => fail
      ? { error: { message: "offline" } }
      : (removed.push(...paths), { error: null }),
    download: async () => ({ data: null, error: { message: "not found" } }),
  });
  return { up, removed, restore: () => { Files.storage = orig; } };
};

ta("an upload that fails is marked and retried, not lost", async () => {
  const fs = fileStub(), bad = storageStub({ fail: true });
  const o = M.createOrder({ type: "prod", product: "Offline probe", client: "T",
    due: Date.now() + DAY, route: [{ stationId: "cut", estMins: 30 }] }, "m1");

/* ---- marking something as ordered, and when it lands ---- */

t("recording an order says how much is coming and when", () => {
  const sup = M.addSupplier({ name: "ETA Supply", leadDays: 4 }, "m1");
  const mat = M.addMaterial({ sku: "ETA-1", name: "ETA board", unit: "pcs", qty: 10, minQty: 0, supplierId: sup.id }, "m1");
  const o = M.createOrder({ type: "prod", product: "Needs ETA", client: "T",
    due: Date.now() + DAY, route: [{ stationId: "cut", estMins: 30 }] }, "m1");
  M.addOrderMaterial(o.id, mat.id, 60, "m1");

  assert(D.demandRow(mat.id).short === 50, "50 short to begin with");
  assert(D.onOrderDetail(mat.id).total === 0, "and nothing on the way");

  const eta = Date.now() + 6 * DAY;
  const po = M.markDemandOrdered(mat.id, { qty: 50, supplierId: sup.id, expectedAt: eta }, "m1");
  assert(po && po.status === "sent", "it is ordered, not left as a draft :: " + (po && po.status));

  const d = D.onOrderDetail(mat.id);
  assert(d.sent === 50 && d.draft === 0, "fifty on the way :: " + d.sent);
  assert(d.expectedAt === eta, "with the date it is expected");
  assert(!d.late, "which has not passed yet");
  assert(D.demandRow(mat.id).short === 0, "so the row is no longer short");
  assert(!D.demandShortfalls().some(r => r.material && r.material.id === mat.id), "and it drops off the shortfall list");

  M.deletePurchase(po.id, "m1"); M.cancelPurchase(po.id, "m1");
  M.deleteOrder(o.id, "m1"); M.deleteMaterial(mat.id, "m1"); M.deleteSupplier(sup.id, "m1");
});

t("a draft is not an order, and a date that has passed says so", () => {
  const mat = M.addMaterial({ sku: "ETA-2", name: "ETA glue", unit: "L", qty: 0, minQty: 0 }, "m1");
  const o = M.createOrder({ type: "prod", product: "Needs glue", client: "T",
    due: Date.now() + DAY, route: [{ stationId: "cut", estMins: 30 }] }, "m1");
  M.addOrderMaterial(o.id, mat.id, 20, "m1");

  const draft = M.createPurchase({ supplierId: null, lines: [{ materialId: mat.id, qty: 20 }] }, "m1");
  let d = D.onOrderDetail(mat.id);
  assert(d.draft === 20 && d.sent === 0, "a draft counts as coming, but not as ordered :: " + d.sent);
  assert(d.expectedAt === null, "and carries no promise of a date");

  /* a draft still stops a second order being proposed, but it must not read
     as covered — the view says "draft only" rather than a green tick */
  assert(D.demandRow(mat.id).short <= 0, "a draft keeps it off the shortfall list");
  assert(D.onOrderDetail(mat.id).sent === 0, "while nothing is actually ordered");

  M.sendPurchase(draft.id, "m1");
  M.updatePurchase(draft.id, { expectedAt: Date.now() - 2 * DAY }, "m1");
  d = D.onOrderDetail(mat.id);
  assert(d.sent === 20 && d.late, "once sent with a date in the past it reads as overdue");

  M.cancelPurchase(draft.id, "m1");
  M.deleteOrder(o.id, "m1"); M.deleteMaterial(mat.id, "m1");
});

t("the picker filters a long list, ignoring diacritics", () => {
  const opts = [
    { value: "a", label: "AVENTOS HK-S mechanizmo dangtelis, baltos „Silk“ spalvos, dešinys", sub: "20K8A21.SW.D" },
    { value: "b", label: "Blum Antaro stalčiaus šonas Silk White, dešinys 500", sub: "378M5002SA.SW.R" },
    { value: "c", label: "Egger U763 ST9", sub: "EGGERU-18-2" },
    { value: "d", label: "Fanera 12x1220x2440 RIGA TEX", sub: "FANERA-12" },
  ];
  const host = document.createElement("div");
  host.innerHTML = Picker.html("t-pick", { value: "c", options: opts, empty: "— none —",
    actions: [{ value: "__new", label: "＋ Create" }] });
  document.body.appendChild(host);
  Picker.bind(host);

  const input = host.querySelector(".picker-input");
  const hidden = host.querySelector('input[type="hidden"]');
  assert(input.value === "Egger U763 ST9", "it opens showing the current choice");
  assert(hidden.id === "t-pick" && hidden.value === "c", "the value lives under the caller's id");

  input.focus();
  input.value = "stalciaus"; input.oninput();          // typed without diacritics
  const matches = () => [...host.querySelectorAll(".picker-row")]
    .filter(r => !/Create/.test(r.textContent));       // the create action always stays
  assert(matches().length === 1, "one match :: " + matches().length);
  assert(/Antaro/.test(matches()[0].textContent), "the right one, though the data has š and č");
  assert(![...host.querySelectorAll(".picker-row")].some(r => /none/.test(r.textContent)),
    "and “none” is not offered as a search result");

  input.value = "EGGERU"; input.oninput();
  assert(matches().length === 1 && /Egger/.test(matches()[0].textContent), "the SKU is searched too");
  let rows = matches();

  let fired = 0;
  hidden.onchange = () => fired++;
  rows[0].onmousedown({ preventDefault() {} });
  assert(hidden.value === "c", "picking sets the value");
  assert(fired === 1, "and fires a change event, so old call sites still work");

  input.focus(); input.value = ""; input.oninput();
  const all = [...host.querySelectorAll(".picker-row")];
  assert(all.length === opts.length + 2, "empty search shows everything plus none/create :: " + all.length);
  assert(/none/.test(all[0].textContent) && /Create/.test(all[1].textContent), "with the actions on top");

  input.value = "zzzz"; input.oninput();
  assert(!matches().length, "a miss shows no materials :: " + matches().length);
  assert(/Nothing matches/.test(host.querySelector(".picker-menu").textContent), "and says so");
  assert([...host.querySelectorAll(".picker-row")].some(r => /Create/.test(r.textContent)),
    "while still offering to create one — which is what you want after a bad search");
  host.remove();
});

t("demand adds up every unfinished job, not the stock minimums", () => {
  const mat = M.addMaterial({ sku: "DM-1", name: "Demand board", unit: "pcs", qty: 30, minQty: 5 }, "m1");
  const mk = (product, qty) => {
    const o = M.createOrder({ type: "prod", product, client: "T", due: Date.now() + DAY,
      route: [{ stationId: "cut", estMins: 30 }] }, "m1");
    M.addOrderMaterial(o.id, mat.id, qty, "m1");
    return o;
  };
  const a = mk("Demand A", 40), b = mk("Demand B", 25);

  const row = D.materialDemand().find(r => r.material && r.material.id === mat.id);

/* ---- purchasing: suppliers and purchase orders ---- */

t("a purchase order is a promise — nothing moves until it is received", () => {
  const mat = M.addMaterial({ sku: "PRB-1", name: "Probe board", unit: "pcs", qty: 4, minQty: 10 }, "m1");
  const sup = M.addSupplier({ name: "Probe Supply", leadDays: 4 }, "m1");
  const po = M.createPurchase({ supplierId: sup.id, lines: [{ materialId: mat.id, qty: 30 }] }, "m1");

  assert(/^PO-\d+$/.test(po.num), "gets a number :: " + po.num);
  assert(po.status === "draft", "starts as a draft");
  assert(D.material(mat.id).qty === 4, "drafting does not touch the shelf");
  assert(D.onOrder(mat.id) === 30, "but it does count as on its way");

  M.sendPurchase(po.id, "m1");
  assert(po.status === "sent" && po.sentAt, "sending records when");
  assert(Math.round((po.expectedAt - Date.now()) / DAY) === 4, "expected date comes from the supplier's lead time");
  assert(D.material(mat.id).qty === 4, "and still nothing on the shelf");

  M.receivePurchase(po.id, null, "m1");
  assert(D.material(mat.id).qty === 34, "receiving is what moves stock :: " + D.material(mat.id).qty);
  assert(po.status === "received", "and closes the order");
  assert(D.onOrder(mat.id) === 0, "nothing outstanding any more");
  const move = D.lastMove(mat.id);
  assert(move.delta === 30 && move.note.includes(po.num), "the delivery is in the material's own history :: " + move.note);

  M.deletePurchase(po.id, "m1");
  M.deleteMaterial(mat.id, "m1"); M.deleteSupplier(sup.id, "m1");
});

t("a part delivery leaves the rest on order", () => {

  const po = M.createPurchase({ supplierId: sup.id, lines: [{ materialId: mat.id, qty: 20 }] }, "m1");

  M.receivePurchase(po.id, { [po.lines[0].id]: 8 }, "m1");
  assert(D.material(mat.id).qty === 8, "eight arrived");
  assert(po.status === "sent", "the order stays open");
  assert(D.onOrder(mat.id) === 12, "twelve still to come :: " + D.onOrder(mat.id));

  M.receivePurchase(po.id, { [po.lines[0].id]: 999 }, "m1");
  assert(D.material(mat.id).qty === 20, "over-receiving is capped at what was ordered :: " + D.material(mat.id).qty);
  assert(po.status === "received", "and now it is closed");
  assert(!M.receivePurchase(po.id, null, "m1"), "a closed order cannot be received again");
  assert(D.material(mat.id).qty === 20, "so the stock is not counted twice");

  M.deleteMaterial(mat.id, "m1"); M.deleteSupplier(sup.id, "m1");
});

t("the reorder suggestion does not order what is already coming", () => {

t("drafting reorders makes one order per supplier, and says what it skipped", () => {
  const a = M.addSupplier({ name: "Probe A" }, "m1");
  const b = M.addSupplier({ name: "Probe B" }, "m1");
  const mk = (sku, supplierId) => {
    const m = M.addMaterial({ sku, name: sku, unit: "pcs", qty: 0, minQty: 5 }, "m1");
    if (supplierId) M.updateMaterial(m.id, { supplierId }, "m1");
    return m;
  };
  const m1 = mk("PRB-A1", a.id), m2 = mk("PRB-A2", a.id), m3 = mk("PRB-B1", b.id), m4 = mk("PRB-X", null);

  const before = D.purchases().length;
  const { created, skipped } = M.draftReorder("m1");
  assert(created.length === 2, "one order per supplier, not one per material :: " + created.length);
  assert(skipped === 1, "the material with no supplier is reported, not dropped silently :: " + skipped);
  assert(D.purchases().length === before + 2, "both were saved");
  const forA = created.find(p => p.supplierId === a.id);
  assert(forA.lines.length === 2, "supplier A's two materials share one order");
  assert(created.every(p => p.status === "draft"), "and nothing is sent on your behalf");

  for (const p of created) M.deletePurchase(p.id, "m1");
  for (const m of [m1, m2, m3, m4]) M.deleteMaterial(m.id, "m1");
  M.deleteSupplier(a.id, "m1"); M.deleteSupplier(b.id, "m1");
});

t("a supplier with an order still out cannot be deleted", () => {

t("only a draft can be edited or deleted", () => {

t("a project is finished when its last task is done", () => atWork(() => {
  const now = Date.now();
  const o = M.createOrder({ type: "prod", product: "Report probe", client: "T", due: now + DAY,
    route: [{ stationId: "cut", estMins: 60 }, { stationId: "asm", estMins: 60 }] }, "m1");
  assert(D.orderFinishedAt(o) === null, "not finished while both tasks are open");
  o.ops[0].status = "done"; o.ops[0].completedAt = now - DAY;
  assert(D.orderFinishedAt(o) === null, "nor with one still open");
  o.ops[1].status = "done"; o.ops[1].completedAt = now;
  assert(D.orderFinishedAt(o) === now, "the last completion is the finish");
  o.shippedAt = now + 60000;
  assert(D.orderFinishedAt(o) === now + 60000, "shipping wins once it is recorded");
  M.deleteOrder(o.id, "m1");
}));

t("the report counts finished work in its window, and splits by scope", () => atWork(() => {
  const now = Date.now();
  const win = { from: now - 30 * DAY, to: now };
  const base = D.report({ ...win, scope: "all" });          // the seed has finished work of its own
  const baseProd = D.report({ ...win, scope: "prod" }).count;
  const baseEng = D.report({ ...win, scope: "eng" }).count;

  const made = [];
  const mk = (type, stationId, finAgo, due) => {
    // engineering projects are built from stages; production ones from a route
    const shape = type === "eng" ? { stages: [stationId] } : { route: [{ stationId, estMins: 60 }] };
    const o = M.createOrder({ type, product: "Rep " + made.length, client: "T", due, ...shape }, "m1");
    o.createdAt = now - 25 * DAY;
    o.ops[0].status = "done"; o.ops[0].completedAt = now - finAgo * DAY;
    made.push(o);
  };
  mk("prod", "cut", 3, now - 5 * DAY);      // finished after its due date
  mk("prod", "cut", 5, now);                // comfortably on time
  mk("eng", "eg-brief", 2, now);            // engineering, on time
  mk("prod", "cut", 200, now);              // finished long before the window opens

  const all = D.report({ ...win, scope: "all" });
  assert(all.count === base.count + 3, "three of the four land inside the window :: " + (all.count - base.count));
  assert(all.onTime === base.onTime + 2, "and one of them missed its date");
  assert(D.report({ ...win, scope: "prod" }).count === baseProd + 2, "production only");
  assert(D.report({ ...win, scope: "eng" }).count === baseEng + 1, "engineering only");
  for (const o of made) M.deleteOrder(o.id, "m1");
}));

t("buckets are weekly, and monthly once the range is long", () => {

/* NOT wrapped in atWork, and it finishes its own project rather than leaning
   on the seed. The seed dates itself from the REAL clock, so a test that pins
   time to a fixed past date and then reads seeded data rots the moment the
   calendar walks past the pin — which is exactly what happened here. */
t("the CSV export carries one row per finished project", () => {
  const wasRange = Reports.range, wasScope = Reports.scope;
  const o = M.createOrder({ type: "prod", product: "CSV probe", client: "Client, with a comma",
    due: Date.now() - DAY, route: [{ stationId: "cut", estMins: 30 }] }, "m1");
  o.createdAt = Date.now() - 5 * DAY;
  o.ops[0].status = "done"; o.ops[0].qtyDone = o.items[0].qty; o.ops[0].completedAt = Date.now() - 2 * DAY;
  Store.save();

  Reports.range = "all"; Reports.scope = "all";
  const r = Reports.data();
  const lines = Reports.csv().split("\n");
  assert(r.count >= 1, "at least the project this test just finished :: " + r.count);
  assert(lines.length === r.count + 1, "a header plus every project :: " + lines.length + " for " + r.count);
  assert(lines[0].startsWith("Number,Project,Client"), "with a header row");
  const mine = lines.find(l => l.includes("CSV probe"));
  assert(mine, "our project is in there");
  assert(/,(yes|no),/.test(mine), "and carries the on-time answer :: " + mine);
  assert(/"Client, with a comma"/.test(mine), "a comma in a name is quoted, not a new column");

  M.deleteOrder(o.id, "m1");
  Reports.range = wasRange; Reports.scope = wasScope;
});

/* The bug this guards against: someone adds a new .js file, wires it into
   index.html, and the offline app silently breaks because sw.js never
   learned about it. (i18n.js was forgotten in test.html once already.) */
ta("the offline cache covers every file index.html loads", async () => {
  const base = "http://localhost:8734/";
  const [html, sw] = await Promise.all([
    fetch(base + "index.html").then(r => r.text()),
    fetch(base + "sw.js").then(r => r.text()),
  ]);
  const list = (re) => new Set([...(((sw.match(re) || [])[1]) || "").matchAll(/"([^"]+)"/g)].map(m => m[1]));
  const cached = list(/const SHELL = \[([\s\S]*?)\];/);
  const optional = list(/const OPTIONAL = \[([\s\S]*?)\];/);
  assert(cached.size > 10, "read the SHELL list :: " + cached.size);
  const assets = [...html.matchAll(/(?:<script src="|<link rel="stylesheet" href=")([A-Za-z0-9._\/-]+)"/g)].map(m => m[1]);
  assert(assets.length >= 12, "found the app's assets :: " + assets.length);
  const missing = assets.filter(a => !cached.has(a) && !optional.has(a));
  assert(!missing.length, "every asset is precached — missing: " + missing.join(", "));
  assert(cached.has("index.html") && cached.has("manifest.json"), "and the shell itself");
});

ta("the app is installable — the manifest is valid and complete", async () => {
  const base = "http://localhost:8734/";
  const m = await fetch(base + "manifest.json").then(r => r.json());
  assert(m.display === "standalone", "opens without browser chrome");
  assert(m.name && m.short_name, "both a full and a home-screen name");
  const sizes = m.icons.map(i => i.sizes);
  assert(sizes.includes("192x192") && sizes.includes("512x512"), "the two sizes Android requires :: " + sizes);
  assert(m.icons.some(i => i.purpose === "maskable"), "a maskable icon, or Android crops the logo square");
  const r = await fetch(base + m.icons[0].src);
  assert(r.ok && (r.headers.get("content-type") || "").includes("png"), "the icon file is really there");
});
